[pytest]
# Tests are co-located with each kernel under csrc/cute/. Restrict collection to csrc so the
# CUTLASS submodule's own test tree under 3rdparty/ is never picked up. importlib mode lets the
# scattered test_*.py files (no packages, identical-prefix names) import cleanly.
testpaths = csrc
python_files = test_*.py
addopts = --import-mode=importlib
